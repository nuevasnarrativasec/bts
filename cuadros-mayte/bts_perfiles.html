<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BTS — Perfiles por miembro</title>
<style>
:root {
  --bg: #0f0f13;
  --card: #1a1a22;
  --border: #2a2a38;
  --text: #f0f0f5;
  --muted: #888899;
  --pre: #6C63FF;
  --post: #FF6584;
  --font: 'Helvetica Neue', Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }
header { padding: 2rem 2rem 1rem; border-bottom: 1px solid var(--border); }
.header-label { font-size: 11px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
.header-title { font-size: 24px; font-weight: 600; margin-bottom: 0.3rem; }
.header-sub { font-size: 13px; color: var(--muted); line-height: 1.6; }
.tabs { display: flex; gap: 0; padding: 0 2rem; border-bottom: 1px solid var(--border); overflow-x: auto; }
.tab { font-size: 13px; padding: 0.8rem 1.2rem; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; background: none; border-top: none; border-left: none; border-right: none; white-space: nowrap; transition: all 0.15s; }
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); font-weight: 600; border-bottom-color: var(--text); }
.content { display: none; padding: 2rem; max-width: 1100px; }
.content.active { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
.full-width { grid-column: 1 / -1; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1.25rem 1.5rem; }
.card-title { font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 1rem; }
.member-hero { display: flex; align-items: flex-start; gap: 1.5rem; }
.member-emoji { font-size: 56px; line-height: 1; }
.member-info { flex: 1; }
.member-name { font-size: 28px; font-weight: 700; margin-bottom: 2px; }
.member-role { font-size: 13px; color: var(--muted); margin-bottom: 0.5rem; }
.member-alias { font-size: 12px; color: var(--muted); font-style: italic; }
.member-desc { font-size: 14px; line-height: 1.7; color: #ccc; margin-top: 1rem; }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; }
.stat { text-align: center; padding: 0.75rem; background: var(--bg); border-radius: 8px; }
.stat-val { font-size: 22px; font-weight: 700; }
.stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 2px; }
.era-compare { display: flex; flex-direction: column; gap: 0.75rem; }
.era-row { display: flex; gap: 1rem; align-items: center; }
.era-label { font-size: 11px; color: var(--muted); width: 90px; flex-shrink: 0; }
.bar-group { flex: 1; display: flex; flex-direction: column; gap: 3px; }
.bar-line { display: flex; align-items: center; gap: 6px; }
.bar-name { font-size: 10px; color: var(--muted); width: 80px; flex-shrink: 0; }
.bar-track { flex: 1; height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 3px; transition: width 0.6s ease; }
.bar-val { font-size: 10px; color: var(--muted); width: 28px; text-align: right; }
.song-row { display: flex; justify-content: space-between; align-items: flex-start; padding: 0.5rem 0; border-bottom: 1px solid var(--border); }
.song-row:last-child { border-bottom: none; }
.song-name { font-size: 13px; font-weight: 500; }
.song-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
.brecha-badge { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; flex-shrink: 0; }
.pos { background: rgba(108,99,255,0.2); color: #6C63FF; }
.neg { background: rgba(255,101,132,0.2); color: #FF6584; }
.neu { background: rgba(100,200,100,0.15); color: #4CAF50; }
.tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 11px; padding: 3px 10px; border-radius: 99px; background: var(--bg); border: 1px solid var(--border); color: var(--muted); }
.quote { border-left: 2px solid var(--border); padding: 0.5rem 1rem; font-size: 13px; font-style: italic; color: #aaa; line-height: 1.6; }
.quote-attr { font-size: 11px; color: var(--muted); margin-top: 4px; font-style: normal; }
.insight { background: var(--bg); border-radius: 8px; padding: 0.75rem 1rem; font-size: 13px; color: #ccc; line-height: 1.6; margin-bottom: 0.5rem; }
.insight strong { color: var(--text); }
@media (max-width: 700px) {
  .content.active { grid-template-columns: 1fr; }
  .full-width { grid-column: 1; }
  .stat-grid { grid-template-columns: repeat(2, 1fr); }
}
</style>

function renderBar(val, color) {
  return `<div class="bar-track"><div class="bar-fill" style="width:${val*100}%;background:${color}"></div></div><span class="bar-val">${val.toFixed(2)}</span>`;
}

function renderMember(m) {
  const hasPre = m.pre !== null;
  const hasPost = m.post !== null;

  const brechaPreLabel = m.brecha_pre === null ? '—' : (m.brecha_pre >= 0 ? '+' : '') + m.brecha_pre.toFixed(2);
  const brechaPostLabel = m.brecha_post === null ? '—' : (m.brecha_post >= 0 ? '+' : '') + m.brecha_post.toFixed(2);
  const brechaPreClass = m.brecha_pre === null ? 'neu' : m.brecha_pre > 0.1 ? 'pos' : m.brecha_pre < -0.1 ? 'neg' : 'neu';
  const brechaPostClass = m.brecha_post === null ? 'neu' : m.brecha_post > 0.1 ? 'pos' : m.brecha_post < -0.1 ? 'neg' : 'neu';

  const canciones = [m.mayor_brecha_pos, m.mayor_brecha_neg].filter(Boolean);

  return `
  <div class="content active" id="content-${m.id}">

    <div class="card full-width">
      <div class="member-hero">
        <div class="member-emoji">${m.emoji}</div>
        <div class="member-info">
          <div class="member-name">${m.name}</div>
          <div class="member-role">${m.role}</div>
          <div class="member-alias">${m.alias}</div>
          <div class="member-desc">${m.desc}</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Perfil sonoro — Spotify</div>
      <div class="era-compare">
        ${['valence','energy','speechiness','acousticness','danceability'].map(feat => `
          <div>
            <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px">${feat}</div>
            <div class="bar-line" style="margin-bottom:3px">
              <span class="bar-name" style="color:#6C63FF;font-size:10px">Pre-servicio</span>
              ${renderBar(m.pre[feat], '#6C63FF')}
            </div>
            <div class="bar-line">
              <span class="bar-name" style="color:#FF6584;font-size:10px">Reencuentro</span>
              ${renderBar(m.post[feat], '#FF6584')}
            </div>
          </div>
        `).join('')}
      </div>
    </div>

    <div class="card">
      <div class="card-title">Brecha letra vs música</div>
      <div class="stat-grid" style="margin-bottom:1rem">
        <div class="stat">
          <div class="stat-val ${brechaPreClass === 'pos' ? '' : brechaPreClass === 'neg' ? '' : ''}" style="color:${m.brecha_pre===null?'#666':m.brecha_pre>0.1?'#6C63FF':m.brecha_pre<-0.1?'#FF6584':'#4CAF50'}">${brechaPreLabel}</div>
          <div class="stat-label">Brecha pre-servicio</div>
        </div>
        <div class="stat">
          <div class="stat-val" style="color:${m.brecha_post===null?'#666':m.brecha_post>0.1?'#6C63FF':m.brecha_post<-0.1?'#FF6584':'#4CAF50'}">${brechaPostLabel}</div>
          <div class="stat-label">Brecha reencuentro</div>
        </div>
        <div class="stat">
          <div class="stat-val">${m.canciones_analizadas}</div>
          <div class="stat-label">Canciones analizadas</div>
        </div>
      </div>

      ${canciones.length > 0 ? `
      <div class="card-title" style="margin-top:1rem">Casos extremos</div>
      ${canciones.map(c => `
        <div class="song-row">
          <div>
            <div class="song-name">${c.t}</div>
            <div class="song-meta">${c.y} · ${c.em}</div>
          </div>
          <span class="brecha-badge ${c.b > 0.1 ? 'pos' : c.b < -0.1 ? 'neg' : 'neu'}">${c.b >= 0 ? '+' : ''}${c.b.toFixed(2)}</span>
        </div>
      `).join('')}` : '<div style="color:var(--muted);font-size:13px">Sin datos suficientes en inglés para calcular brecha</div>'}

      <div class="card-title" style="margin-top:1rem">Hallazgo clave</div>
      <div class="insight">${m.insight}</div>
    </div>

    <div class="card">
      <div class="card-title">Perfil emocional</div>
      <div style="display:flex;gap:1rem;margin-bottom:1rem">
        <div style="flex:1;background:var(--bg);border-radius:8px;padding:0.75rem;text-align:center">
          <div style="font-size:11px;color:#6C63FF;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px">Pre-servicio</div>
          <div style="font-size:14px;font-weight:600">${m.emocion_pre}</div>
        </div>
        <div style="flex:1;background:var(--bg);border-radius:8px;padding:0.75rem;text-align:center">
          <div style="font-size:11px;color:#FF6584;text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px">Reencuentro</div>
          <div style="font-size:14px;font-weight:600">${m.emocion_post}</div>
        </div>
      </div>
      <div class="card-title">Temas dominantes</div>
      <div class="tag-list" style="margin-bottom:1rem">
        ${m.temas.map(t => `<span class="tag">${t}</span>`).join('')}
      </div>
      <div class="card-title">Discurso público</div>
      <div class="quote">
        "${m.quote}"
        <div class="quote-attr">— ${m.quote_attr}</div>
      </div>
    </div>

    ${m.papers.length > 0 ? `
    <div class="card full-width">
      <div class="card-title">Papers académicos sobre este miembro</div>
      ${m.papers.map(p => `<div class="insight">📄 ${p}</div>`).join('')}
    </div>` : ''}

  </div>`;
}

// Build tabs and contents
const tabsEl = document.getElementById('tabs');
const contentsEl = document.getElementById('contents');

MEMBERS.forEach((m, i) => {
  const btn = document.createElement('button');
  btn.className = 'tab' + (i === 0 ? ' active' : '');
  btn.textContent = m.emoji + ' ' + m.name;
  btn.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('content-' + m.id).classList.add('active');
  };
  tabsEl.appendChild(btn);
  contentsEl.innerHTML += renderMember(m);
});
</script>
</body>
</html>
