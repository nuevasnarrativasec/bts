<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BTS · Perfil por miembro</title>
<style>
  :root {
    --ink: #16161d;
    --muted: #7a7a85;
    --line: #e6e6ea;
    --panel: #f4f4f6;
    --card: #ffffff;
    --red: #E5484D;
    --pre-color: #E7A9C4;
    --post-color: #4B3F91;
    --font: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
  }

@font-face {
    font-family: 'Bobby Jones Condensed';
    src: url('https://nuevasnarrativasec.github.io/bts/fonts/BobbyJones-Condensed.woff2') format('woff2'),
        url('https://nuevasnarrativasec.github.io/bts/fonts/BobbyJones-Condensed.woff') format('woff');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
}

@font-face {
    font-family: 'Monigue Regular';
    src: url('https://nuevasnarrativasec.github.io/bts/fonts/Monigue-Regular.woff2') format('woff2'),
        url('https://nuevasnarrativasec.github.io/bts/fonts/Monigue-Regular.woff') format('woff');
    font-weight: normal;
    font-style: normal;
    font-display: swap;
}

@font-face {
    font-family: 'Prelo Book';
    src: url('https://nuevasnarrativasec.github.io/bts/fonts/Prelo-Book.woff2') format('woff2'),

    font-weight: normal;
    font-style: normal;
    font-display: swap;
}

@font-face {
    font-family: 'Prelo Medium';
    src: url('https://nuevasnarrativasec.github.io/bts/fonts/Prelo-Medium.woff2') format('woff2'),
        url('https://nuevasnarrativasec.github.io/bts/fonts/Prelo-Medium.woff') format('woff');
    font-style: normal;
    font-display: swap;
}

@font-face {
    font-family: 'Prelo Semibold';
    src: url('https://nuevasnarrativasec.github.io/bts/fonts/Prelo-SemiBold.woff2') format('woff2'),
        url('https://nuevasnarrativasec.github.io/bts/fonts/Prelo-SemiBold.woff') format('woff');
    font-weight: 600;
    font-style: normal;
    font-display: swap;
}

@font-face {
    font-family: 'Prelo Bold';
    src: url('https://nuevasnarrativasec.github.io/bts/fonts/Prelo-Bold.woff2') format('woff2'),

    font-weight: bold;
    font-style: normal;
    font-display: swap;

@font-face {
    font-family: 'Prelo Extrabold';

        url('https://nuevasnarrativasec.github.io/bts/fonts/Prelo-Exbd.woff') format('woff');

    font-display: swap;

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #fff; color: var(--ink); font-family: var(--font); padding: 2rem 1.5rem 4rem; }
  .wrap {
    max-width: 980px; margin: 0 auto; border: 1.5px solid var(--ink); border-radius: 28px;
    padding: 2rem 2.5rem 2.5rem; position: relative;
  }

  /* Search bar */
  .search-bar {
    display: flex; align-items: center; gap: 0.75rem;
    border: 1.5px solid var(--ink); border-radius: 999px;
    padding: 0.75rem 1.4rem; max-width: 680px; margin: 0 auto 2.5rem;
  }
  .search-bar svg { flex: none; color: var(--muted); }
  .search-bar select {
    flex: 1; border: none; outline: none; font-family: var(--font); font-size: 15px;
    color: var(--ink); background: transparent; appearance: none; cursor: pointer;
  }
  .search-bar select:invalid { color: var(--muted); }
  .search-bar .chev { flex: none; color: var(--ink); }

  .content { display: grid; grid-template-columns: 320px 1fr; gap: 2.5rem; align-items: start; }

  /* Left column */
  .avatar-lg {
    width: 170px; height: 170px; border-radius: 50%; overflow: hidden; margin-bottom: 1.5rem;
  }
  .avatar-lg img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .member-name {
    font-size: 52px; line-height: 0.95; margin-bottom: 0.6rem; text-transform: uppercase;
    font-family: 'Monigue Regular';
  }
  .headline {
    font-size: 21px; color: var(--red); text-transform: uppercase;
    margin-bottom: 1rem; line-height: 1.25; font-family: 'Monigue Regular';
  }
  .description { font-size: 14.5px; color: var(--ink); line-height: 1.65; max-width: 340px; font-family: 'Prelo Book';}

  /* Right column: radar */
  .radar-head { display: flex; align-items: flex-start; justify-content: space-around; margin-bottom: 0.5rem; flex-wrap: wrap; gap: 1rem; }
  .radar-title { font-size: 16px; font-family: 'Prelo Extrabold';}
  .radar-legend {    display: flex;
    gap: .5rem;
    flex-direction: column;}
  .legend-item { display: flex; align-items: center; gap: 0.5rem; font-size: 13px; font-family: 'Prelo Extrabold';}
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }

  .radar-svg-wrap { display: flex; justify-content: center; }
  .radar-svg-wrap svg { width: 100%; height: auto; max-width: 560px; }

  .callout {
    background: var(--panel); border-radius: 12px; padding: 0.9rem 1.4rem;
    font-size: 13.5px; margin-top: 0.5rem;
  }
  .callout b { color: var(--red); }

  /* Indicadores claves */
  .indicators-title { font-size: 15px; font-weight: 800; margin: 2.5rem 0 1rem; }
  .indicators-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
  .ind-card { border: 1.5px solid var(--ink); border-radius: 16px; padding: 1.25rem 1.4rem 1.5rem; }
  .ind-head { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 1.5rem; }
  .ind-icon { flex: none; color: var(--red); max-width: 30px;}
  .ind-label { font-size: 15px; line-height: 1.25; font-family: 'Prelo Extrabold';}
  .ind-label span { display: block; font-size: 14px; }

  .slider { position: relative; height: 46px; margin: 0 4px; }
  .slider-track { position: absolute; top: 22px; left: 0; right: 0; height: 2px; background: var(--line); }
  .slider-fill { position: absolute; top: 22px; height: 2px; background: var(--red); }
  .slider-dot { position: absolute; top: 18px; width: 10px; height: 10px; border-radius: 50%; background: #B7B7B7; transform: translateX(-50%); }
  .slider-dot.active { background: var(--red); }
  .slider-val { position: absolute; top: -10px; transform: translateX(-50%); font-size: 15px; font-weight: 800; white-space: nowrap; font-family: 'Prelo Medium';}
  .slider-era { position: absolute; top: 30px; transform: translateX(-50%); font-size: 11px; color: #B1B1B1; white-space: nowrap; }

  footer { margin-top: 2.5rem; font-size: 12px; color: #b0b0b8; text-align: center; }

  @media (max-width: 860px) {
    .content { grid-template-columns: 1fr; }
    .indicators-grid { grid-template-columns: 1fr; }
    .wrap { padding: 1.5rem 1.25rem 2rem; }
  }

  @media (max-width: 640px) {
    body { padding: 1rem 0.75rem 3rem; }
    .wrap { padding: 1.25rem 1rem 1.75rem; border-radius: 20px; }
    .search-bar { padding: 0.6rem 1.1rem; margin-bottom: 1.75rem; }
    .avatar-lg { width: 120px; height: 120px; margin: 0 auto 1.1rem; }
    .left-col { text-align: center; }
    .member-name { font-size: 38px; }
    .headline { font-size: 17px; }
    .description { max-width: none; margin: 0 auto; }
    .radar-head { justify-content: center; text-align: center; }
    .indicators-grid { gap: 1rem; }
    .ind-card { padding: 1rem 1.1rem 1.25rem; }
  }
</style>

const AXES = ["Valence","Energy","Danceability","Acousticness","Speechiness"];
const AXIS_LABEL = {
  Valence: ["Valence", "(más luminoso)"],
  Energy: ["Energy", "(más intenso)"],
  Danceability: ["Danceability", "(más bailable)"],
  Acousticness: ["Acousticness", "(más acústico)"],
  Speechiness: ["Speechiness", "(más voz hablada)"]
};
const IND_LABEL = {
  Valence: ["Valence", "(Más luminoso)"],
  Energy: ["Energy", "(Más intenso)"],
  Danceability: ["Danceability", "(Más bailable)"],
  Acousticness: ["Acousticness", "(Más acústico)"],
  Speechiness: ["Speechiness", "(Más voz hablada)"]
};
const ICONS = {
  Valence: '<img src="../img/icon-valence.jpg" width="100%">',
  Energy: '<img src="../img/icon-energia.jpg" width="100%">',
  Danceability: '<img src="../img/icon-acustico.jpg" width="100%">',
  Acousticness: '<img src="../img/icon-acustico.jpg" width="100%">',
  Speechiness: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>'
};

const fmt = v => v.toFixed(2).replace('.', ',');

// --- Populate selector ---
const select = document.getElementById('member-select');
DATA.forEach((d, i) => {
  const opt = document.createElement('option');
  opt.value = i;
  opt.textContent = d.label;
  select.appendChild(opt);
});

// --- Radar chart (D3) ---
const size = 560, cx = size / 2, cy = size / 2, radius = 150;
const angleSlice = (Math.PI * 2) / AXES.length;
const rScale = d3.scaleLinear().domain([0, 1]).range([0, radius]);

const svg = d3.select('#radar').append('svg')
  .attr('width', size).attr('height', size)
  .attr('viewBox', `0 0 ${size} ${size}`);

const g = svg.append('g').attr('transform', `translate(${cx},${cy})`);

// grid rings
const levels = 5;
for (let l = 1; l <= levels; l++) {
  const r = radius * (l / levels);
  const pts = AXES.map((_, i) => {
    const angle = angleSlice * i - Math.PI / 2;
    return [r * Math.cos(angle), r * Math.sin(angle)];
  });
  g.append('polygon')
    .attr('points', pts.map(p => p.join(',')).join(' '))
    .attr('fill', 'none')
    .attr('stroke', '#e6e6ea')
    .attr('stroke-width', 1);
}

// axis lines + labels
AXES.forEach((ax, i) => {
  const angle = angleSlice * i - Math.PI / 2;
  const x2 = radius * Math.cos(angle), y2 = radius * Math.sin(angle);
  g.append('line').attr('x1', 0).attr('y1', 0).attr('x2', x2).attr('y2', y2)
    .attr('stroke', '#d8d8de').attr('stroke-width', 1);

  const lx = (radius + 55) * Math.cos(angle), ly = (radius + 55) * Math.sin(angle);
  const anchor = Math.abs(x2) < 4 ? 'middle' : (x2 > 0 ? 'start' : 'end');
  const label = g.append('text')
    .attr('x', lx).attr('y', ly)
    .attr('text-anchor', anchor)
    .attr('dominant-baseline', 'middle')
    .style('font-size', '12px').style('font-weight', 800).style('fill', '#16161d');
  label.append('tspan').attr('x', lx).attr('dy', '-0.3em').text(AXIS_LABEL[ax][0]);
  label.append('tspan').attr('x', lx).attr('dy', '1.2em').style('font-weight', 600).style('fill', '#7a7a85').style('font-size', '10.5px').text(AXIS_LABEL[ax][1]);
});

// scale labels (top axis: Valence)
[[0.2,'0,2'], [0.4,'0,4'], [0.6,'0,6'], [0.8,'0,8'], [1.0,'1,0']].forEach(([v, label]) => {
  g.append('text')
    .attr('x', 4).attr('y', -rScale(v) - 2)
    .style('font-size', '9.5px').style('fill', '#9a9aa2').text(label);
});

const lineGen = d3.line().curve(d3.curveLinearClosed);

function pointsFor(values) {
  return AXES.map((ax, i) => {
    const angle = angleSlice * i - Math.PI / 2;
    const r = rScale(values[ax]);
    return [r * Math.cos(angle), r * Math.sin(angle)];
  });
}

const prePath = g.append('path').attr('fill', 'var(--pre-color)').attr('fill-opacity', 0.18)
  .attr('stroke', 'var(--pre-color)').attr('stroke-width', 2);
const postPath = g.append('path').attr('fill', 'var(--post-color)').attr('fill-opacity', 0.16)
  .attr('stroke', 'var(--post-color)').attr('stroke-width', 2.5);

const preDots = g.append('g');
const postDots = g.append('g');

function renderRadar(d) {
  const prePts = pointsFor(d.pre);
  const postPts = pointsFor(d.post);
  prePath.attr('d', lineGen(prePts));
  postPath.attr('d', lineGen(postPts));

  preDots.selectAll('circle').data(prePts).join('circle')
    .attr('cx', p => p[0]).attr('cy', p => p[1]).attr('r', 4.5)
    .attr('fill', 'var(--pre-color)').attr('stroke', '#fff').attr('stroke-width', 1.5);
  postDots.selectAll('circle').data(postPts).join('circle')
    .attr('cx', p => p[0]).attr('cy', p => p[1]).attr('r', 5)
    .attr('fill', 'var(--post-color)').attr('stroke', '#fff').attr('stroke-width', 1.5);
}

// --- Indicators ---
const indicatorsEl = document.getElementById('indicators');

function renderIndicators(d) {
  indicatorsEl.innerHTML = '';
  d.indicators.forEach(ax => {
    const card = document.createElement('div');
    card.className = 'ind-card';

    const preV = d.pre[ax], postV = d.post[ax];
    const preX = preV * 100, postX = postV * 100;
    const left = Math.min(preX, postX), width = Math.abs(postX - preX);
    const close = Math.abs(postX - preX) < 13;
    const preLabelX = close ? Math.max(0, Math.min(preX, postX) - 7) : preX;
    const postLabelX = close ? Math.min(100, Math.max(preX, postX) + 7) : postX;

    card.innerHTML = `
      <div class="ind-head">
        <span class="ind-icon">${ICONS[ax]}</span>
        <div class="ind-label">${IND_LABEL[ax][0]}<span>${IND_LABEL[ax][1]}</span></div>
      </div>
      <div class="slider">
        <div class="slider-track"></div>
        <div class="slider-fill" style="left:${left}%; width:${width}%;"></div>
        <div class="slider-dot" style="left:0%;"></div>
        <div class="slider-dot" style="left:100%;"></div>
        <div class="slider-dot active" style="left:${preX}%;"></div>
        <div class="slider-dot active" style="left:${postX}%;"></div>
        <div class="slider-val" style="left:${preLabelX}%;">${fmt(preV)}</div>
        <div class="slider-val" style="left:${postLabelX}%;">${fmt(postV)}</div>
        <div class="slider-era" style="left:0%; transform:translateX(0);">2013–2022</div>
        <div class="slider-era" style="left:100%; transform:translateX(-100%);">2023–2025</div>
      </div>
    `;
    indicatorsEl.appendChild(card);
  });
}

function renderProfile(idx) {
  const d = DATA[idx];
  document.getElementById('avatar-img').src = '../img/' + d.avatar;
  document.getElementById('avatar-img').alt = d.label;
  document.getElementById('member-name').textContent = d.label;
  document.getElementById('headline').textContent = d.headline;
  document.getElementById('description').textContent = d.description;
  renderRadar(d);
  renderIndicators(d);
  select.value = idx;
}

select.addEventListener('change', () => renderProfile(+select.value));

renderProfile(1); // default: RM
</script>
</body>
</html>
