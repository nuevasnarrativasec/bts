<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
            font-style: normal;
            font-weight: normal;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .main-banner{
            position: relative;
            height: 395px;
            width: 1290px;
            max-width: 100%;
            margin: 0 auto;
            overflow: hidden;
        }
        .main-banner > video{
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }
        .bnr-video--movil{ display: none; }

        /* Capa de texto sobre el video */
        .banner-overlay{
            position: absolute;
            inset: 0;
            z-index: 2;
            display: grid;
            grid-template-columns: 41% 31% 28%;
            align-items: center;
            color: #fff;
        }
        .bo-col{ padding: 0 34px; }
        .bo-col--center{ text-align: center; }
        .bo-col--main{ text-align: center; }

        /* Columna 1 · título principal */
        .bo-col--main .bo-title{
            font-family:'Roboto',system-ui,-apple-system,sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 2.55rem;
            line-height: 1.02;
            color: #fff;
            margin-bottom: 20px;
        }
        .bo-col--main .bo-title .rojo{ color:#EA3A2D; font-weight: 900; }

        /* Columnas 2 y 3 · preguntas */
        .bo-col--center .bo-title{
            font-family:'Roboto',system-ui,-apple-system,sans-serif;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 2rem;
            line-height: 1.05;
            color: #fff;
            margin-bottom: 12px;
        }
        .bo-sub{
            font-family:'Roboto',system-ui,-apple-system,sans-serif;
            font-weight: 400;
            font-size: 1.18rem;
            line-height: 1.35;
            color: #fff;
            margin-bottom: 26px;
        }

        /* Botones */
        .bo-btn{
            display: inline-block;
            font-family:'Roboto',system-ui,-apple-system,sans-serif;
            font-weight: 700;
            font-size: 1.02rem;
            line-height: 1;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 10px;
            transition: transform .15s ease, filter .15s ease;
        }
        .bo-btn:hover{ transform: translateY(-1px); filter: brightness(1.05); }
        .bo-btn--orange{ background:#E96A28; color:#fff; }
        .bo-btn--light{ background:#fff; color:#161616; }

        /* Firma inferior izquierda */
        .bo-firma{
            position: absolute;
            left: 34px;
            bottom: 20px;
            z-index: 3;
            font-family:'Roboto',system-ui,-apple-system,sans-serif;
            font-weight: 700;
            font-size: .82rem;
            letter-spacing: .04em;
            text-transform: uppercase;
            color: #fff;
        }

        /* Escritorio angosto: mantiene proporción del banner horizontal */
        @media (max-width: 1310px) and (min-width: 769px){
            .main-banner{ width: 100%; height: auto; aspect-ratio: 1290 / 395; }
        }

        /* ===================== VERSIÓN MÓVIL (video vertical) ===================== */
        @media (max-width: 768px){
            .bnr-video--desktop{ display: none; }
            .bnr-video--movil{ display: block; }

            .main-banner{ width: 100%; height: auto; aspect-ratio: 440 / 852; }

            .banner-overlay{
                grid-template-columns: 1fr;
                grid-template-rows: repeat(3, 1fr);
                place-items: center;
                text-align: center;
            }
            .bo-col{ padding: 0 8vw; width: 100%; }

            .bo-col--main .bo-title{
                font-size: 8.6vw;
                line-height: 1.04;
                margin-bottom: 5.5vw;
            }
            .bo-col--center .bo-title{
                font-size: 7.8vw;
                line-height: 1.06;
                margin-bottom: 3.5vw;
            }
            .bo-sub{
                font-size: 4.5vw;
                line-height: 1.35;
                margin-bottom: 6vw;
            }
            .bo-btn{
                font-size: 3.5vw;
                padding: 3.4vw 2.5vw;
                border-radius: 2.6vw;
            }
            .bo-firma{ 
                left: 10px;
                top: 30%;
            }
        }

        @media only screen and (max-width: 820px){
            .bo-col{
                padding: 10px;
            }
            .bo-col--main .bo-title{
                font-size: 2rem;
            }
            .bo-col--main{
                margin-top: -10px;
            }
            .bo-col--center .bo-title{
                font-size: 1.5rem;
            }
            .bo-sub{
                font-size: 1.1rem;
            }
            .bo-btn{
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <div class="main-banner">
        <a href="https://elcomercio.pe/luces/bts-en-peru-historia-integrantes-army-arirang-analisis-canciones-world-tour-lima-2026-especdis-narp-noticia/">
            <video class="bnr-video--desktop" src="https://nuevasnarrativasec.github.io/bts/video/banner-home-desktop-trivia.mp4?v2" autoplay muted loop playsinline></video>
        </a>

        <a href="https://elcomercio.pe/luces/bts-en-peru-historia-integrantes-army-arirang-analisis-canciones-world-tour-lima-2026-especdis-narp-noticia/">
            <video class="bnr-video--movil" src="https://nuevasnarrativasec.github.io/bts/video/banner-home-movil-trivia.mp4" autoplay muted loop playsinline></video>
        </a>                
    </div>

</body>
</html>
